name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        if [ -f "LANChatApp.zip" ]; then
          unzip -o LANChatApp.zip -d extracted_app
          # Auto-locate gradlew and copy everything to working directory
          GRADLEW_PATH=$(find extracted_app -name gradlew -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found project at: $PROJECT_DIR"
            cp -r "$PROJECT_DIR"/* . || true
            cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
          fi
        fi

    - name: Clean Invalid Plugins
      run: |
        if [ -f "build.gradle.kts" ]; then
          sed -i '/org.jetbrains.kotlin.plugin.compose/d' build.gradle.kts
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LANChat-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
